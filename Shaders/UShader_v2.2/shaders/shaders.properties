profile.Performance=!cloudVolumeEnabled CLOUD_RENDER_LOD=3.0 !fogVolumeEnabled !waterVolumeEnabled !END_VolumetricSmoke shadowMapResolution=1024 !shadowVPSEnabled !RTAO_ENABLED ResolutionScale=0.5 !cloudShadowsEnabled shadowFilterIterations=9
