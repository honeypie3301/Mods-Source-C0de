profile.Quality=profile.Default CLOUD_RENDER_LOD=1.0 waterVolumeEnabled shadowMapResolution=4096 shadowVPSEnabled shadowFilterIterations=12

screen=INFO <profile> <empty> [ATMOS] [LIGHT] [TERRAIN] [CAMERA] [POST] [MISC]
